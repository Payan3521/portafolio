<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Juan Pablo Bedoya Payán - Full Stack Developer Portfolio">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080810"/>
      <stop offset="50%" stop-color="#0c0d16"/>
      <stop offset="100%" stop-color="#0a1a24"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative blobs -->
  <ellipse cx="150" cy="100" rx="200" ry="150" fill="url(#accentGrad)" opacity="0.08"/>
  <ellipse cx="1050" cy="530" rx="250" ry="180" fill="url(#accentGrad)" opacity="0.06"/>

  <!-- Content -->
  <g transform="translate(120, 180)">
    <!-- Logo/Initials -->
    <rect x="0" y="0" width="80" height="80" rx="16" fill="url(#accentGrad)"/>
    <text x="40" y="54" text-anchor="middle" dominant-baseline="middle"
          font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="white">JP</text>

    <!-- Name -->
    <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#e8ebf5" letter-spacing="-1">Juan Pablo Bedoya Payán</text>

    <!-- Role -->
    <text x="0" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#22d3ee">Full Stack Developer</text>
    <text x="0" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#99a2bd">Software Engineering Student · 7th/8th Semester</text>

    <!-- Tagline -->
    <text x="0" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="16" line-height="24" fill="#99a2bd" width="600">
      Construyo aplicaciones web escalables con código limpio, arquitectura sólida y una obsesión por documentar y automatizar.
    </text>

    <!-- Tech badges -->
    <g transform="translate(0, 380)">
      <g style="font-family: 'JetBrains Mono', monospace; font-size: 12; font-weight: 600;">
        <rect x="0" y="0" width="110" height="32" rx="6" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
        <text x="55" y="22" text-anchor="middle" fill="#22d3ee">TypeScript</text>

        <rect x="120" y="0" width="80" height="32" rx="6" fill="#22d3ee" opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
        <text x="160" y="22" text-anchor="middle" fill="#8b5cf6">React</text>

        <rect x="210" y="0" width="90" height="32" rx="6" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
        <text x="255" y="22" text-anchor="middle" fill="#10b981">Node.js</text>

        <rect x="310" y="0" width="100" height="32" rx="6" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
        <text x="360" y="22" text-anchor="middle" fill="#f59e0b">Next.js</text>

        <rect x="420" y="0" width="100" height="32" rx="6" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
        <text x="470" y="22" text-anchor="middle" fill="#3b82f6">NestJS</text>

        <rect x="530" y="0" width="90" height="32" rx="6" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
        <text x="575" y="22" text-anchor="middle" fill="#8b5cf6">AWS</text>
      </g>

      <g transform="translate(0, 45)" style="font-family: 'JetBrains Mono', monospace; font-size: 12; font-weight: 600;">
        <rect x="0" y="0" width="90" height="32" rx="6" fill="#ec4899" opacity="0.2" stroke="#ec4899" stroke-width="1"/>
        <text x="45" y="22" text-anchor="middle" fill="#ec4899">PostgreSQL</text>

        <rect x="100" y="0" width="80" height="32" rx="6" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
        <text x="140" y="22" text-anchor="middle" fill="#06b6d4">Docker</text>

        <rect x="190" y="0" width="110" height="32" rx="6" fill="#a855f7" opacity="0.2" stroke="#a855f7" stroke-width="1"/>
        <text x="245" y="22" text-anchor="middle" fill="#a855f7">GitHub Actions</text>

        <rect x="310" y="0" width="70" height="32" rx="6" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="1"/>
        <text x="345" y="22" text-anchor="middle" fill="#6366f1">Tailwind</text>

        <rect x="390" y="0" width="90" height="32" rx="6" fill="#14b8a6" opacity="0.2" stroke="#14b8a6" stroke-width="1"/>
        <text x="435" y="22" text-anchor="middle" fill="#14b8a6">Prisma</text>
      </g>
    </g>

    <!-- Links -->
    <g transform="translate(0, 500)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e8ebf5">Conecta conmigo:</text>
      <g transform="translate(0, 30)">
        <!-- GitHub -->
