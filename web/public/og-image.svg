        <path d="M20 72c-6.6 0-12 5.4-12 12s5.4 12 12 12 12-5.4 12-12-5.4-12-12-12zm0 20c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm10.7-16.7c-.6-1.6-2.2-2.7-3.8-2.7h-2.3v-4.3c0-1.1-.02-2.5-.02-2.5s-.8-.8-2-0c0 0-.02 1.4-.02 2.5v4.3h-2.3c-1.6 0-3.2 1.1-3.8 2.7v4.3h2.8v-4.3c0-.6.2-1.1.5-1.4.2-.2.5-.4.9-.4.4 0 .7.2.9.4.3.3.5.8.5 1.4v4.3h2.8v-4.3zM20 56c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4z" fill="white" transform="scale(0.5) translate(16, 92)"/>
        <text x="50" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#99a2bd">linkedin.com/in/juan-pablo-bedoya-payán</text>

        <!-- WhatsApp -->
        <circle cx="20" cy="156" r="16" fill="#25D366"/>
        <path d="M20 142c-6.6 0-12 5.4-12 12s5.4 12 12 12 12-5.4 12-12-5.4-12-12-12zm4.2 14.5c-.3.1-.6.2-.9.2-.3 0-.6-.1-.8-.3-.2-.2-.3-.3-.5-.5-.2-.2-.4-.4-.5-.6-.1-.2-.2-.3-.2-.5 0-.1.1-.3.2-.4.1-.1.2-.2.3-.4.1-.2.1-.3.1-.5 0-.1-.1-.3-.2-.4-.2-.3-.5-.7-.8-.9-.3-.2-.5-.3-.7-.4-.2-.1-.4-.1-.6-.1-.2 0-.4 0-.6.1-.2.1-.5.3-.7.5-.2.2-.4.4-.6.6-.2.2-.3.4-.3.7 0 .3.1.6.3.8.2.2.5.5.8.8.3.3.5.6.7.9.2.3.3.6.3 1 0 .4-.1.8-.3 1.1-.2.3-.5.6-.8.9-.3.3-.6.5-1 .7-.4.2-.9.3-1.4.3-.5 0-1-.1-1.5-.3-.4-.2-.8-.4-1.1-.7-.3-.3-.5-.7-.7-1.1-.2-.4-.3-.8-.3-1.3 0-.5.1-.9.3-1.3.2-.4.5-.8.8-1.1.3-.3.6-.5 1-.7.4-.2.9-.3 1.4-.3.5 0 1 .1 1.5.3.4.2.8.4 1.1.7.3.3.5.7.7 1.1.2.4.3.8.3 1.3 0 .5-.1.9-.3 1.3-.2.4-.5.8-.8 1.1-.3.3-.6.5-1 .7-.4.2-.9.3-1.4.3z" fill="white" transform="scale(0.5) translate(16, 184)"/>
        <text x="50" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#99a2bd">wa.me/573019298995</text>
      </g>
    </g>
  </g>

  <!-- Footer line -->
  <text x="600" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3b3f5a">Building software with attention to detail.</text>
</svg>