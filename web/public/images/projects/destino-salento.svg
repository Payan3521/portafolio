<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-salento" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a15"/>
      <stop offset="50%" stop-color="#0e2920"/>
      <stop offset="100%" stop-color="#184232"/>
    </linearGradient>
    <radialGradient id="glow-salento" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-salento)"/>
  <circle cx="400" cy="180" r="300" fill="url(#glow-salento)"/>

  <!-- Mountain Silhouettes -->
  <path d="M0 450 L0 320 Q 200 260 400 310 T 800 280 L800 450 Z" fill="#0d2e23" fill-opacity="0.6"/>
  <path d="M0 450 L0 360 Q 300 300 550 350 T 800 340 L800 450 Z" fill="#081f18" fill-opacity="0.8"/>

  <!-- Palm Trees (Palma de Cera) -->
  <g stroke="#34d399" stroke-width="2.5" fill="none">
    <line x1="680" y1="380" x2="680" y2="180"/>
    <path d="M680 180 Q660 160 650 170 M680 180 Q700 160 710 170 M680 180 Q670 150 675 145 M680 180 Q690 150 685 145"/>
    
    <line x1="720" y1="400" x2="720" y2="220"/>
    <path d="M720 220 Q705 205 695 212 M720 220 Q735 205 745 212 M720 220 Q715 195 720 190"/>
  </g>

  <!-- Browser Window Mockup -->
  <g transform="translate(80, 50)">
    <rect width="640" height="340" rx="16" fill="#0b221a" fill-opacity="0.9" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect width="640" height="42" rx="16" fill="#123327"/>
    <!-- Window buttons -->
    <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5.5" fill="#10b981"/>
    <!-- Search bar -->
    <rect x="140" y="9" width="360" height="24" rx="6" fill="#081813" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="320" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6ee7b7">https://destinosalento.travel</text>

    <!-- Header inside -->
    <g transform="translate(40, 65)">
      <text x="0" y="28" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#ffffff">Destino Salento <tspan fill="#34d399">· Quindío</tspan></text>
      <text x="0" y="50" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Plataforma de ecoturismo, reservas, rutas del café y Valle de Cocora</text>
    </g>

    <!-- Tourism Cards Mockup -->
    <g transform="translate(40, 135)">
      <rect x="0" y="0" width="170" height="110" rx="10" fill="#143b2d" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="35" font-size="18">🌴</text>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff">Valle de Cocora</text>
      <text x="20" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">Trekking &amp; Naturaleza</text>

      <rect x="195" y="0" width="170" height="110" rx="10" fill="#143b2d" stroke="#ffffff" stroke-width="1" stroke="#34d399" stroke-opacity="0.4"/>
      <text x="215" y="35" font-size="18">☕</text>
      <text x="215" y="70" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff">Ruta del Café</text>
      <text x="215" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">Fincas Tradicionales</text>

      <rect x="390" y="0" width="170" height="110" rx="10" fill="#143b2d" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="410" y="35" font-size="18">🏡</text>
      <text x="410" y="70" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff">Hospedajes</text>
      <text x="410" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7">Glamping &amp; Hoteles</text>
    </g>

    <!-- Footer inside -->
    <g transform="translate(40, 265)">
      <rect width="560" height="50" rx="8" fill="#0d281f" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">Next.js · Mapas Interactivos · Sistema de Reservas · TypeScript</text>
    </g>
  </g>
</svg>
