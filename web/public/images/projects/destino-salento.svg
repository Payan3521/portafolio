<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Sunset Andean Mountain Sky Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e112a"/>
      <stop offset="35%" stop-color="#4a154b"/>
      <stop offset="65%" stop-color="#b45309"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Mountain Layers Gradients -->
    <linearGradient id="mountain-far" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1b4e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#190e2b" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="mountain-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14362b"/>
      <stop offset="100%" stop-color="#092019"/>
    </linearGradient>

    <linearGradient id="mountain-near" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f291e"/>
      <stop offset="100%" stop-color="#06130d"/>
    </linearGradient>

    <!-- UI Surface Gradients -->
    <linearGradient id="ui-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b131c" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#050a10" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16222f"/>
      <stop offset="100%" stop-color="#0d1722"/>
    </linearGradient>

    <linearGradient id="gold-cta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="emerald-tag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="heavy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Mist Fog -->
    <linearGradient id="mist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="1200" height="675" fill="url(#sky-grad)"/>

  <!-- Sun in Horizon -->
  <circle cx="680" cy="310" r="70" fill="#fef3c7" opacity="0.6"/>
  <circle cx="680" cy="310" r="130" fill="#fde68a" opacity="0.2"/>

  <!-- Distant Mountain Ranges (Andes Central Cordillera) -->
  <path d="M0 320 Q200 240 420 280 T850 250 T1200 290 L1200 675 L0 675 Z" fill="url(#mountain-far)"/>
  <rect y="270" width="1200" height="80" fill="url(#mist)"/>

  <!-- Mid Mountain Range (Valle de Cocora slopes) -->
  <path d="M0 360 Q280 290 560 350 T1050 320 T1200 370 L1200 675 L0 675 Z" fill="url(#mountain-mid)"/>
  <rect y="350" width="1200" height="90" fill="url(#mist)"/>

  <!-- Foreground Mountain Slope -->
  <path d="M0 430 Q340 380 720 440 T1200 410 L1200 675 L0 675 Z" fill="url(#mountain-near)"/>

  <!-- Iconic Quindío Wax Palms (Palma de Cera - Ceroxylon quindiuense) -->
  <!-- Palm 1 (Left tall) -->
  <g transform="translate(180, 160)">
    <path d="M12 280 Q10 140 14 0" stroke="#d1d5db" stroke-width="4.5" fill="none" opacity="0.85"/>
    <path d="M12 280 Q10 140 14 0" stroke="#6b7280" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- Palm Crown -->
    <g transform="translate(14, 0)">
      <path d="M0 0 C-15 -20 -35 -15 -42 -5" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C-10 -25 -25 -30 -30 -20" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C-5 -30 10 -35 15 -25" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C15 -30 30 -25 38 -15" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C20 -20 40 -10 44 2" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C10 -10 25 15 28 25" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C-10 -10 -25 15 -28 25" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Palm 2 (Far left medium) -->
  <g transform="translate(90, 220)">
    <path d="M8 220 Q7 110 9 0" stroke="#e5e7eb" stroke-width="3.5" fill="none" opacity="0.75"/>
    <g transform="translate(9, 0) scale(0.8)">
      <path d="M0 0 C-15 -20 -35 -15 -42 -5" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C-5 -30 10 -35 15 -25" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C20 -20 40 -10 44 2" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C-10 -10 -25 15 -28 25" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Palm 3 (Mid right tall) -->
  <g transform="translate(480, 190)">
    <path d="M10 240 Q12 120 9 0" stroke="#d1d5db" stroke-width="3.8" fill="none" opacity="0.8"/>
    <g transform="translate(9, 0) scale(0.85)">
      <path d="M0 0 C-15 -20 -35 -15 -42 -5" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C-10 -25 -25 -30 -30 -20" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C15 -30 30 -25 38 -15" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C20 -20 40 -10 44 2" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Dark overlay gradient at bottom to cleanly house UI components -->
  <rect y="240" width="1200" height="435" fill="url(#ui-dark)" opacity="0.94"/>

  <!-- ======================== UI OVERLAY ======================== -->

  <!-- Top Navigation Bar -->
  <g transform="translate(60, 35)" filter="url(#heavy-shadow)">
    <rect width="1080" height="66" rx="18" fill="#080e16" fill-opacity="0.92" stroke="#1e2e42" stroke-width="1.2"/>

    <!-- Brand Logo -->
    <g transform="translate(24, 15)">
      <rect width="36" height="36" rx="10" fill="url(#gold-cta)"/>
      <path d="M10 26 L18 10 L26 26 Z" fill="#0b131c"/>
      <path d="M18 10 L22 18 L18 20 L14 18 Z" fill="#ffffff"/>
      <text x="48" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1">DESTINO<tspan fill="#f59e0b">SALENTO</tspan></text>
      <text x="235" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10b981" letter-spacing="1.5">QUINDÍO · COLOMBIA</text>
    </g>

    <!-- Nav items -->
    <g transform="translate(560, 24)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f59e0b">Experiencias</text>
      <text x="110" y="15" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Valle de Cocora</text>
      <text x="240" y="15" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Fincas Cafeteras</text>
      <text x="375" y="15" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Hospedajes</text>
    </g>

    <!-- Booking CTA button -->
    <g transform="translate(940, 14)">
      <rect width="116" height="38" rx="10" fill="url(#emerald-tag)"/>
      <text x="58" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Reservar Ahora</text>
    </g>
  </g>

  <!-- Search & Filter Bar Floating -->
  <g transform="translate(60, 125)" filter="url(#card-shadow)">
    <rect width="1080" height="60" rx="14" fill="#0d1825" fill-opacity="0.92" stroke="#22364e" stroke-width="1"/>

    <g transform="translate(24, 18)">
      <circle cx="12" cy="12" r="7" stroke="#f59e0b" stroke-width="2" fill="none"/>
      <line x1="17" y1="17" x2="23" y2="23" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="17" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">¿Qué quieres vivir hoy? Ej: Cabalgata Cocora, Tour café de altura, Calle Real…</text>
    </g>

    <!-- Weather & Elevation Pill -->
    <g transform="translate(860, 14)">
      <rect width="196" height="32" rx="8" fill="#162334" stroke="#253a52" stroke-width="1"/>
      <text x="98" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">⛅ 19°C · 1,895 m.s.n.m · Salento</text>
    </g>
  </g>

  <!-- Main Experiences Grid: 3 Rich Cards -->

  <!-- Card 1: Valle de Cocora -->
  <g transform="translate(60, 210)" filter="url(#card-shadow)">
    <rect width="340" height="425" rx="20" fill="url(#card-grad)" stroke="#1e3247" stroke-width="1"/>

    <!-- Image mockup header -->
    <g transform="translate(14, 14)">
      <rect width="312" height="190" rx="14" fill="#13271f"/>
      <path d="M0 190 L90 70 L170 140 L240 50 L312 190 Z" fill="#0b1e16" opacity="0.8"/>
      <line x1="220" y1="170" x2="220" y2="70" stroke="#e2e8f0" stroke-width="2.5"/>
      <circle cx="220" cy="65" r="14" fill="#10b981"/>

      <!-- Badge on image -->
      <rect x="12" y="12" width="105" height="24" rx="6" fill="url(#emerald-tag)"/>
      <text x="64" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">ECOTURISMO</text>

      <!-- Rating Pill -->
      <rect x="236" y="12" width="64" height="24" rx="6" fill="#0b131c" fill-opacity="0.85"/>
      <text x="268" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">★ 4.9</text>
    </g>

    <!-- Content -->
    <g transform="translate(20, 230)">
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Valle de Cocora &amp; Palmas</text>
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Trekking por el bosque de niebla entre las palmas de cera más altas del mundo.</text>

      <g transform="translate(0, 72)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">⏱ 5 Horas  ·  🥾 Dificultad Media</text>
      </g>

      <!-- Pricing and button -->
      <g transform="translate(0, 115)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Desde</text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#f59e0b">$75.000 <tspan font-size="11" font-weight="500" fill="#94a3b8">COP</tspan></text>

        <g transform="translate(180, 8)">
          <rect width="120" height="36" rx="10" fill="#1e3247" stroke="#38bdf8" stroke-width="1"/>
          <text x="60" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Ver Detalles →</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Card 2: Tour del Café -->
  <g transform="translate(430, 210)" filter="url(#card-shadow)">
    <rect width="340" height="425" rx="20" fill="url(#card-grad)" stroke="#1e3247" stroke-width="1"/>

    <!-- Image mockup header -->
    <g transform="translate(14, 14)">
      <rect width="312" height="190" rx="14" fill="#29180c"/>
      <circle cx="156" cy="95" r="50" fill="#451a03"/>
      <path d="M126 95 Q156 55 186 95 Q156 135 126 95 Z" fill="#b45309"/>
      <line x1="156" y1="65" x2="156" y2="125" stroke="#78350f" stroke-width="3"/>

      <rect x="12" y="12" width="118" height="24" rx="6" fill="url(#gold-cta)"/>
      <text x="71" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">CAFÉ DE ORIGEN</text>

      <rect x="236" y="12" width="64" height="24" rx="6" fill="#0b131c" fill-opacity="0.85"/>
      <text x="268" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">★ 5.0</text>
    </g>

    <!-- Content -->
    <g transform="translate(20, 230)">
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Ruta del Café Tradicional</text>
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Recorrido por finca cafetera viva: siembra, beneficio, tostión y cata profesional guiada.</text>

      <g transform="translate(0, 72)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f59e0b">⏱ 3.5 Horas  ·  ☕ Cata Incluida</text>
      </g>

      <g transform="translate(0, 115)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Desde</text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#f59e0b">$60.000 <tspan font-size="11" font-weight="500" fill="#94a3b8">COP</tspan></text>

        <g transform="translate(180, 8)">
          <rect width="120" height="36" rx="10" fill="#1e3247" stroke="#f59e0b" stroke-width="1"/>
          <text x="60" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">Ver Detalles →</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Card 3: Salento Pueblo & Miradores -->
  <g transform="translate(800, 210)" filter="url(#card-shadow)">
    <rect width="340" height="425" rx="20" fill="url(#card-grad)" stroke="#1e3247" stroke-width="1"/>

    <!-- Image mockup header -->
    <g transform="translate(14, 14)">
      <rect width="312" height="190" rx="14" fill="#1a1829"/>
      <polygon points="40,150 70,110 100,150" fill="#e11d48"/>
      <rect x="45" y="150" width="50" height="40" fill="#fef08a"/>
      <polygon points="120,140 160,95 200,140" fill="#0284c7"/>
      <rect x="130" y="140" width="60" height="50" fill="#ffffff"/>
      <polygon points="220,155 250,120 280,155" fill="#16a34a"/>
      <rect x="225" y="155" width="50" height="35" fill="#fef08a"/>

      <rect x="12" y="12" width="100" height="24" rx="6" fill="#8b5cf6"/>
      <text x="62" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">CULTURA &amp; ARTE</text>

      <rect x="236" y="12" width="64" height="24" rx="6" fill="#0b131c" fill-opacity="0.85"/>
      <text x="268" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">★ 4.8</text>
    </g>

    <!-- Content -->
    <g transform="translate(20, 230)">
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Calle Real &amp; Miradores</text>
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Arquitectura colonial antioqueña, artesanías típicas y vista panorámica al Valle.</text>

      <g transform="translate(0, 72)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a855f7">📍 Salento Urbano  ·  🚶 Paseo Guiado</text>
      </g>

      <g transform="translate(0, 115)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Desde</text>
        <text x="0" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#f59e0b">$40.000 <tspan font-size="11" font-weight="500" fill="#94a3b8">COP</tspan></text>

        <g transform="translate(180, 8)">
          <rect width="120" height="36" rx="10" fill="#1e3247" stroke="#a855f7" stroke-width="1"/>
          <text x="60" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a855f7" text-anchor="middle">Ver Detalles →</text>
        </g>
      </g>
    </g>
  </g>
</svg>
