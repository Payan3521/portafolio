<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" aria-label="Juan Pablo Bedoya Payán — Perfil">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-pattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="480" height="560" fill="url(#bg)"/>
  <rect width="480" height="560" fill="url(#grid-pattern)"/>
  <circle cx="240" cy="230" r="170" fill="url(#halo)"/>

  <!-- Developer Silhouette / Avatar -->
  <g transform="translate(0, 10)">
    <!-- Halo ring -->
    <circle cx="240" cy="205" r="95" fill="none" stroke="url(#primary)" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
    <circle cx="240" cy="205" r="82" fill="url(#card-glass)" stroke="url(#primary)" stroke-width="2.5"/>

    <!-- Head & Shoulders stylized -->
    <circle cx="240" cy="180" r="42" fill="url(#primary)" opacity="0.9"/>
    <!-- Head shine -->
    <path d="M215 155 Q240 145 265 155 Q250 170 215 155" fill="#ffffff" opacity="0.3"/>
    <!-- Shoulders -->
    <path d="M140 330 C155 255 190 245 240 245 C290 245 325 255 340 330 Z" fill="url(#primary)" opacity="0.85"/>
    <path d="M140 330 C155 255 190 245 240 245 C290 245 325 255 340 330" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

    <!-- Tech details: glowing binary / code lines in avatar background -->
    <text x="240" y="380" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#06b6d4" letter-spacing="4" opacity="0.85">&lt;SOFTWARE ENGINEER /&gt;</text>
  </g>

  <!-- Bottom glass card -->
  <rect x="50" y="445" width="380" height="75" rx="16" fill="url(#card-glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="240" y="476" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Juan Pablo Bedoya Payán</text>
  <text x="240" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#99a2bd">Full Stack Developer · Universidad EAM</text>
</svg>
