<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" aria-label="Foto de perfil (placeholder)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141029"/>
      <stop offset="0.5" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#0a1a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="560" fill="url(#bg)"/>
  <rect width="480" height="560" fill="url(#grid)"/>
  <rect width="480" height="560" fill="url(#glow)"/>

  <!-- Silueta -->
  <circle cx="240" cy="230" r="78" fill="url(#accent)" fill-opacity="0.22"/>
  <circle cx="240" cy="222" r="70" fill="none" stroke="url(#accent)" stroke-width="3" stroke-opacity="0.7"/>
  <path d="M120 470c0-70 54-120 120-120s120 50 120 120" fill="url(#accent)" fill-opacity="0.14" stroke="url(#accent)" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Iniciales -->
  <text x="240" y="245" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="56" font-weight="700" fill="url(#accent)">JP</text>

  <!-- Etiqueta -->
  <text x="240" y="530" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" letter-spacing="3" fill="#99a2bd">TU FOTO AQUÍ</text>
</svg>
